
<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Versenyfeladatok</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4dc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      color: #4a3f1d;
    }
    button {
      margin: 15px;
      padding: 15px 30px;
      font-size: 18px;
      background-color: #4a3f1d;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>Versenyfeladatok – Ókori Egyiptom</h1>
  <button onclick="window.location.href='puzzle/index.html'">1. feladat: Puzzle kirakása</button>
  <button id="quizBtn" disabled>2. feladat: Kvíz kitöltése</button>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const pont = parseFloat(localStorage.getItem("egyiptomPuzzlePont"));
      console.log("DEBUG - egyiptomPuzzlePont:", pont); // debug kiírás

      const gomb = document.getElementById("quizBtn");
      if (!isNaN(pont) && pont > 0) {
        gomb.disabled = false;
        gomb.onclick = () => window.location.href = 'egyiptom-teszt.html';
      } else {
        gomb.disabled = true;
        gomb.onclick = () => alert("Először oldjátok meg a 1. feladatot!");
      }
    });
  </script>
</body>
</html>
